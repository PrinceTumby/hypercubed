[package]
name = "hypercubed_portable_std"
version = "0.1.0"
edition = "2024"

[features]
default = ["std"]
std = [
    # Dependencies
    "dep:string_cache",
    # Dependency features
    "ahash/default",
    "foldhash/default",
]

[dependencies]
ahash.workspace = true
cfg-if.workspace = true
embedded-io.workspace = true
foldhash.workspace = true
hashbrown.workspace = true
nalgebra.workspace = true
smallstr.workspace = true
spin.workspace = true
string_cache = { version = "0", optional = true }
