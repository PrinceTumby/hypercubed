[package]
name = "minecraft_client"
version = "0.1.0"
edition = "2021"

[features]
protocol_verbose = []
tracy = []

[dependencies]
aes = "0.8"
ahash = { version = "0.8", features = [ "serde" ] }
anyhow = "1"
bimap = "0.6"
bitfield = "0.14"
bytebuffer = "2"
bytemuck = { version = "1.14", features = [ "derive" ] }
cfb8 = { version = "0.8", features = [ "std" ] }
env_logger = "0.10"
fixedbitset = "0.5"
flate2 = "1"
image = { version = "0.24", features = [ "png" ] }
indexmap = { version = "2.1", features = [ "serde" ] }
lazy_static = "1.4"
log = "0.4"
nalgebra = { version = "0.32", features = ["serde-serialize"] }
nom-supreme = "0.8"
nom = "7"
num-bigint = "0.4"
petgraph = "0.6"
pollster = "0.3"
protocol_derive = { version = "0.1.0", path = "crates/protocol_derive" }
quartz_nbt = { version = "0.2", features = [ "serde" ] }
rand = { version = "0.8", features = [ "min_const_gen" ] }
reqwest = { version = "0.12", features = [ "blocking", "json" ] }
rsa = "0.9"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
serde_repr = "0.1"
sha1 = "0.10"
string_cache = "0.8"
smallvec = { version = "1.11", features = [ "union", "const_generics", "const_new" ] }
thiserror = "1.0"
threadpool = "1.8"
tracing-subscriber = "0.3"
tracing-tracy = "0.11"
tracing = "0.1"
uuid = { version = "1.4", features = [ "serde", "v3", "v4" ] }
wgpu = "22"
winit = { version = "0.29", features = [ "rwh_05" ] }
egui = { version = "0.28", features = [ "bytemuck" ] }
egui_plot = "0.28"

[profile.release]
debug = 1

[profile.dev]
opt-level = 1
