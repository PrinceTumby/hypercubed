[package]
name = "minecraft_client"
version = "0.1.0"
edition = "2021"

[features]
protocol_verbose = []

[dependencies]
ahash = { version = "0.8", features = [ "serde" ] }
anyhow = "1"
bitfield = "0.14"
bytebuffer = "2"
bytemuck = { version = "1.14", features = [ "derive" ] }
flate2 = "1"
image = { version = "0.24", features = [ "png" ] }
indexmap = { version = "2.1", features = [ "serde" ] }
lazy_static = "1.4"
nalgebra = { version = "0.32", features = [ "serde-serialize" ] }
nom-supreme = "0.8"
nom = "7"
pollster = "0.3"
protocol_derive = { version = "0.1.0", path = "crates/protocol_derive" }
quartz_nbt = "0.2"
rand = "0.8"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
serde_repr = "0.1"
string_cache = "0.8"
smallvec = { version = "1.11", features = [ "union", "const_generics", "const_new" ] }
thiserror = "1.0"
tracing-subscriber = "0.3"
tracing-tracy = "0.10"
tracing = "0.1"
uuid = { version = "1.4", features = [ "v3", "v4" ] }
wgpu = "0.18"
winit = { version = "0.29", features = [ "rwh_05" ] }
log = "0.4"
env_logger = "0.10"

[profile.dev.package.image]
opt-level = 3
