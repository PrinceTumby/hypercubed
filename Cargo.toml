[workspace]
members = [
    "crates/hypercubed_core",
    "crates/hypercubed_portable_std",
    "crates/hypercubed_resources",
    "crates/hypercubed_resources_vanilla",
    "crates/hypercubed_resources_vanilla_data_gen",
    "crates/hypercubed_vanilla",
    "crates/hypercubed_vk_shaders",
    "crates/protocol_derive",
    "crates/vulkano_prelude",
]

[workspace.dependencies]
ahash = { version = "0.8", default-features = false }
anyhow = { version = "1", default-features = false }
bimap = { version = "0.6", default-features = false, features = ["serde"] }
bitfield = "0.19"
bitflags = "2"
bytemuck = { version = "1", features = ["derive"] }
embedded-io = { version = "0.7", features = ["alloc"] }
embedded-io-async = { version = "0.7", features = ["alloc"] }
foldhash = { version = "0.2", default-features = false }
hashbrown = { version = "0.17", features = ["serde"] }
indexmap = { version = "2", default-features = false }
lazy_static = "1"
log = "0.4"
miniz_oxide = "0.9"
once_cell = { version = "1", default-features = false, features = ["alloc"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
vulkano = { git = "https://github.com/vulkano-rs/vulkano", rev = "432955a" }
serde_repr = "0.1"
smallstr = { version = "0.3", features = ["serde"] }
string_cache = "0.11"
thiserror = { version = "2", default-features = false }
wesl = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }

[workspace.dependencies.image]
version = "0.25"
default-features = false
features = ["jpeg", "png"]

[workspace.dependencies.nalgebra]
version = "0.35"
default-features = false
features = ["libm", "macros", "serde", "serde-serialize-no-std"]

[workspace.dependencies.smallvec]
version = "1"
features = ["bincode", "const_generics", "const_new", "serde", "union"]

[workspace.dependencies.spin]
version = "0.12"
default-features = false
features = ["mutex", "spin_mutex", "portable_atomic"]

# Hypercubed crates

[workspace.dependencies.hypercubed_core]
path = "crates/hypercubed_core"
default-features = false

[workspace.dependencies.hypercubed_vk_shaders]
path = "crates/hypercubed_vk_shaders"

[workspace.dependencies.portable_std]
package = "hypercubed_portable_std"
path = "crates/hypercubed_portable_std"
default-features = false

[workspace.dependencies.resources]
package = "hypercubed_resources"
path = "crates/hypercubed_resources"
default-features = false

[workspace.dependencies.resources_vanilla]
package = "hypercubed_resources_vanilla"
path = "crates/hypercubed_resources_vanilla"

[workspace.dependencies.resources_vanilla_data_gen]
package = "hypercubed_resources_vanilla_data_gen"
path = "crates/hypercubed_resources_vanilla_data_gen"

[workspace.dependencies.vanilla]
package = "hypercubed_vanilla"
path = "crates/hypercubed_vanilla"

[workspace.dependencies.vulkano_prelude]
path = "crates/vulkano_prelude"

# Package

[package]
name = "hypercubed"
version = "0.1.0"
edition = "2024"

[lib]
# crate-type = ["lib", "staticlib"]
test = false
bench = false

[[bin]]
name = "hypercubed"

[features]
default = [
    # XXX: DEBUG
    "platform_winit",
    "platform_winit_wayland",
    "graphics_backend_opengl",
    # "graphics_backend_vulkan",
    # "graphics_backend_wgpu",
    # "embed_vanilla_cache",
    # "tracy",
]
# default = ["platform_linux_drm", "graphics_backend_opengl"]

# Represents platforms which have full access to a standard library, and for which using `std`
# should be the default mechanism for most I/O.
# This includes using `std` for stdout/stderr, file I/O, and networking.
full_std = [
    "mini_std",
]

# Represents platforms which don't require `no_std`, but that don't necessarily have access to a
# fully featured standard library.
# For example, the "wasm32-unknown-unknown" target has `std`, but it isn't useful for any I/O.
# These platforms are expected to provide their own I/O abstractions.
mini_std = [
    # Dependencies
    "dep:egui",
    "dep:egui_plot",
    "dep:env_logger",
    "dep:image",
    "dep:pollster",
    "dep:resources_vanilla",
    "dep:threadpool",
    "dep:vanilla",
    # Dependency features
    "ahash/default",
    "ahash/serde",
    "anyhow/default",
    "bimap/default",
    "crab_nbt/default",
    "foldhash/default",
    "indexmap/default",
    "once_cell/default",
    "nalgebra/serde-serialize",
    "nom/default",
    "nom_locate/default",
    "portable_std/default",
    "postcard/use-std",
    "rand/default",
    "resources/default",
    "serde/default",
    "tracing/default",
    "tracing-subscriber/default",
    "uuid/default",
    "uuid/v4",
]

mimalloc = ["dep:mimalloc"]
protocol_verbose = ["full_std"]
tracy = ["dep:tracing-tracy"]

# Data embedding

use_embedded_cache = ["resources/use_embedded_cache"]
embed_vanilla_cache = ["use_embedded_cache"]

# Graphics backends

graphics_backend_wgpu = [
    # Other features
    "platform_winit",
    "mimalloc",
    # Dependencies
    "dep:wesl",
    "dep:wgpu",
]

graphics_backend_vulkan = [
    # Other features
    "platform_winit",
    "mimalloc",
    # Dependencies
    "dep:vulkano",
    "dep:vulkano_prelude",
    "dep:hypercubed_vk_shaders",
]

graphics_backend_opengl = [
    # Other features
    "full_std",
    # Dependencies
    "dep:glutin",
]

# Platforms

platform_winit = [
    # Other features
    "full_std",
    # Dependencies
    "dep:clap",
    "dep:reqwest",
    "dep:winit",
    # Dependency features
    "glutin/default",
    "winit/rwh_06",
]
platform_winit_wayland = [
    "platform_winit",
    "winit/wayland",
    "winit/wayland-csd-adwaita",
    "winit/wayland-dlopen",
]
platform_winit_x11 = [
    "platform_winit",
    "winit/x11",
]

platform_linux_drm = [
    # Other features
    "full_std",
    # Dependencies
    "dep:clap",
    "dep:drm",
    "dep:egli",
    "dep:gbm",
    "dep:input",
    "dep:libseat",
    "dep:raw-window-handle",
    "dep:reqwest",
    "dep:rustix",
    # Dependency features
    "gbm/import-egl",
    "glutin/egl",
]

[build-dependencies]
miniz_oxide.workspace = true
postcard.workspace = true
resources = { workspace = true, features = ["std"] }
resources_vanilla.workspace = true
serde.workspace = true
wesl = { workspace = true, optional = true }

[dependencies]
aes = "0.9"
ahash.workspace = true
anyhow = { version = "1", default-features = false }
bimap.workspace = true
bitfield.workspace = true
bitflags.workspace = true
bytebuffer = { version = "2", optional = true }
bytemuck.workspace = true
bytes = { version = "1", default-features = false }
cfb8 = { version = "0.9" }
clap = { version = "4.6", features = ["derive"], optional = true }
crab_nbt = { version = "0.2", default-features = false }
drm = { version = "0.15", optional = true }
egli = { git = "https://github.com/Nercury/egli-rs", rev = "723ee34", optional = true }
env_logger = { version = "0.11", optional = true }
fixedbitset = "0.5"
foldhash.workspace = true
futures = { version = "0.3", default-features = false, features = ["async-await"] }
gbm = { version = "0.18", default-features = false, features = ["drm-support"], optional = true }
glutin = { version = "0.32", default-features = false, optional = true }
hypercubed_vk_shaders = { workspace = true, optional = true }
image = { workspace = true, optional = true }
indexmap.workspace = true
input = { version = "0.10", optional = true }
libseat = { version = "0.2", default-features = false, optional = true }
log.workspace = true
mimalloc = { version = "0.1", optional = true }
miniz_oxide.workspace = true
nalgebra.workspace = true
nom = { version = "8", default-features = false, features = ["alloc"] }
nom_locate = { version = "5", default-features = false, features = ["alloc"] }
once_cell.workspace = true
ordered-float = { version = "5.3", default-features = false }
pollster = { version = "1.0", optional = true }
portable_std.workspace = true
postcard.workspace = true
protocol_derive = { version = "0.1.0", path = "crates/protocol_derive" }
rand = { version = "0.10", default-features = false, features = ["std_rng"] }
rand_core = "0.10"
raw-window-handle = { version = "0.6", optional = true }
rayon = { version = "1.12", optional = true }
reqwest = { version = "0.13", features = ["blocking", "json"], optional = true }
resources.workspace = true
resources_vanilla = { workspace = true, optional = true }
rustix = { version = "1.1", features = ["event"], optional = true }
serde.workspace = true
serde_json.workspace = true
sha1 = { version = "0.11", default-features = false }
smallvec.workspace = true
thiserror.workspace = true
threadpool = { version = "1.8", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["alloc"] }
tracing-tracy = { version = "0.11", optional = true }
tracing = { version = "0.1", default-features = false, features = ["attributes"] }
uuid = { version = "1", default-features = false, features = ["serde", "v3"] }
vanilla = { workspace = true, optional = true }
vulkano_prelude = { workspace = true, optional = true }
vulkano = { workspace = true, optional = true }
wesl = { workspace = true, optional = true }
wgpu = { version = "30", optional = true }
winit = { version = "0.30", default-features = false, optional = true }

[dependencies.egui]
version = "0.35"
default-features = false
features = ["bytemuck", "default_fonts"]
optional = true

[dependencies.egui_plot]
version = "0.36"
default-features = false
optional = true

[dependencies.rsa]
version = "0.10.0-rc.18"
default-features = false
features = ["encoding"]

# Profiles

[profile.dev]
opt-level = 1

[profile.dev-no-opt]
inherits = "dev"
opt-level = 0
panic = "unwind"
debug = "full"
strip = "none"

[profile.release]
debug = false
lto = true
codegen-units = 1
panic = "abort"

[profile.release-profiling]
inherits = "release"
lto = true
codegen-units = 8
panic = "abort"
debug = "full"
strip = "none"
